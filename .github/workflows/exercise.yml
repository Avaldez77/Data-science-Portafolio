name: Exercise checks

on:
  push:
  pull_request:

jobs:
  base-r-exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true
      - name: Run model validation exercise
        run: Rscript "Exercises/Model Validation/solution.R"
      - name: Run rolling-origin backtest
        run: Rscript "Exercises/Time Series Backtesting/rolling_origin.R"
      - name: Run difference-in-differences exercise
        run: Rscript "Exercises/Impact Evaluation/difference_in_differences.R"
      - name: Run survival analysis exercise
        run: Rscript "Exercises/Time-to-Event Analysis/survival_analysis.R"
      - name: Run exercise checks
        run: Rscript Exercises/tests.R
